<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAM TECH SOLUTIONS TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
    
    <style>
        :root {
            --bg: #060913;
            --card-bg: rgba(22, 27, 34, 0.4);
            --gold: linear-gradient(135deg, #c9a04d 0%, #f0cf86 100%);
            --gold-solid: #c9a04d;
            --cyan-glow: rgba(79, 209, 255, 0.15);
            --text: #f0f4f8;
            --border: rgba(201, 160, 77, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Glow (Mwangaza wa Nyuma) */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(201, 160, 77, 0.12) 0%, transparent 70%);
            top: 15%;
            left: 10%;
            z-index: -1;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--cyan-glow) 0%, transparent 70%);
            bottom: 10%;
            right: -5%;
            z-index: -1;
        }

        /* Main Container */
        .main-container {
            width: 92%;
            max-width: 720px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        /* Header / Logo Style */
        .brand-header {
            margin-bottom: 24px;
        }

        .brand-title {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 1px;
            background: var(--gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        /* Live Indicator Badge */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .live-badge {
            background: #ff3344;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(255, 51, 68, 0.4);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: white;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
        }

        /* Video Wrapper & Player */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        /* Custom Footer Style */
        .footer-text {
            margin-top: 20px;
            font-size: 0.8rem;
            color: rgba(240, 244, 248, 0.4);
            letter-spacing: 0.5px;
        }

        /* Animations */
        @keyframes blink {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        /* Media Queries for Bigger Screens */
        @media (min-width: 600px) {
            .brand-title { font-size: 2.1rem; }
            .main-container { padding: 32px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="brand-header">
            <div class="status-container">
                <span class="live-badge"><span class="live-dot"></span>LIVE</span>
            </div>
            <h1 class="brand-title">BAM Tech Solutions TV</h1>
        </div>

        <div class="video-wrapper">
            <video id="video" controls autoplay muted playsinline></video>
        </div>

        <p class="footer-text">© 2026 BAM Tech Solutions Companies Ltd. All Rights Reserved.</p>
    </div>

    <script>
        // Hapa ndipo utakapoweka link yako ya Live Stream (.m3u8) baadae
        const videoSrc = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
        const video = document.getElementById('video');

        if (Hls.isSupported()) {
            const hls = new Hls({
                maxMaxBufferLength: 10
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>

</body>
</html>
