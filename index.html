<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAM Tech - Universal Video & IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h2 {
            color: #00d2ff;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #222;
            color: white;
            min-width: 200px;
        }
        button {
            padding: 12px 20px;
            background-color: #00d2ff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0099cc;
        }
        video {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 210, 255, 0.2);
            background-color: #000;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #ffaa00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Universal Player</h2>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Weka link ya video au IPTV (.m3u8, .mp4) hapa..." value="https://nasa-i.akamaihd.net/hls/live/253565/NASA-HTTP/master.m3u8">
            <button onclick="playVideo(false)">Play Kawaida</button>
            <button onclick="playVideo(true)">Play na Proxy (Ikishindikana)</button>
        </div>

        <video id="videoPlayer" controls autoplay></video>
        <div id="statusText" class="status">Tayari kucheza...</div>
    </div>

    <script>
        var video = document.getElementById('videoPlayer');
        var statusText = document.getElementById('statusText');
        var hls;

        function playVideo(useProxy) {
            var rawUrl = document.getElementById('videoUrl').value.trim();
            
            if (!rawUrl) {
                statusText.innerText = "Tafadhali weka link kwanza!";
                return;
            }

            // Mfumo wa CORS Proxy kusaidia link zinazozuiwa na browser
            var finalUrl = rawUrl;
            if (useProxy) {
                // Tunatumia corsproxy.io kuvuka mipaka ya CORS
                finalUrl = 'https://corsproxy.io/?' + encodeURIComponent(rawUrl);
                statusText.innerText = "Inajaribu kupitia Proxy server...";
            } else {
                statusText.innerText = "Inajaribu kucheza moja kwa moja...";
            }

            // Kusafisha HLS ya zamani kama ipo
            if (hls) {
                hls.destroy();
            }

            // Kuangalia kama ni link ya m3u8 au video ya kawaida (kama mp4)
            if (rawUrl.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hls = new Hls({
                        debug: false,
                        enableWorker: true
                    });
                    
                    hls.loadSource(finalUrl);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play();
                        statusText.innerText = "Inacheza (HLS Stream) ✓";
                        statusText.style.color = "#00ff00";
                    });

                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    statusText.innerText = "Kosa la Mtandao au CORS. Jaribu kitufe cha 'Play na Proxy'.";
                                    statusText.style.color = "red";
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    statusText.innerText = "Kosa la kusoma video, inajaribu kurekebisha...";
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    statusText.innerText = "Imeshindwa kucheza link hii.";
                                    statusText.style.color = "red";
                                    hls.destroy();
                                    break;
                            }
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Kwa watumiaji wa iOS/Safari (zinakubali m3u8 bila HLS.js)
                    video.src = finalUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play();
                        statusText.innerText = "Inacheza (Native HLS) ✓";
                        statusText.style.color = "#00ff00";
                    });
                }
            } else {
                // Kama ni video ya kawaida (.mp4, .webm n.k)
                video.src = finalUrl;
                video.play().then(() => {
                    statusText.innerText = "Inacheza Video ya Kawaida ✓";
                    statusText.style.color = "#00ff00";
                }).catch((error) => {
                    statusText.innerText = "Imeshindwa kucheza. Jaribu na Proxy.";
                    statusText.style.color = "red";
                });
            }
        }

        // Play default link wakati ina-load
        window.onload = function() {
            playVideo(false);
        };
    </script>
</body>
</html>
