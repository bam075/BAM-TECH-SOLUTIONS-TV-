<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAM TECH TV</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* Eneo la Video */
        .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
        .video-container h1 { color: #555; }
        
        /* Eneo la Juu (Logo, Jina, Live) */
        .top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
        .logo { background: #0056b3; padding: 10px 20px; font-weight: bold; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); font-size: 20px; }
        .program-title { background: rgba(0, 0, 0, 0.7); padding: 10px 20px; border-radius: 5px; font-size: 18px; border: 1px solid #444; }
        .live-badge { background: red; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 16px; animation: blink 1.5s infinite; display: none; }
        
        /* Tangazo la L-Style */
        .l-style-ad { position: absolute; bottom: 60px; left: 20px; width: 30%; height: 60%; background: rgba(255, 165, 0, 0.9); z-index: 5; display: none; padding: 20px; box-sizing: border-box; border-radius: 10px; color: black; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }
        
        /* Maandishi ya chini (Ticker) */
        .ticker { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 86, 179, 0.9); color: white; padding: 12px 0; white-space: nowrap; overflow: hidden; z-index: 10; border-top: 2px solid white; }
        .ticker-text { display: inline-block; padding-left: 100%; animation: scroll 20s linear infinite; font-size: 18px; font-weight: bold; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Hapa ndipo video yako itakapokuwa inacheza -->
        <h1>Eneo la Video ya BAM TECH</h1>
    </div>

    <div class="top-bar">
        <div class="logo">BAM TECH SOLUTIONS</div>
        <div class="program-title" id="display-title">Kipindi: ...</div>
        <div class="live-badge" id="display-live">LIVE</div>
    </div>

    <div class="l-style-ad" id="display-lstyle">
        <h2>TANGAZO MAALUM</h2>
        <p>Hili ni eneo la tangazo lako la L-Style ambalo litatokea tu pale utakapoliwasha kutokea kwenye Jopo la Admin.</p>
    </div>

    <div class="ticker">
        <div class="ticker-text" id="display-ticker">Karibu BAM TECH SOLUTIONS...</div>
    </div>

    <script>
        // Kusikiliza mabadiliko kutoka kwa Admin kila sekunde 1
        setInterval(() => {
            let config = JSON.parse(localStorage.getItem('bam_tv_config'));
            if(config) {
                document.getElementById('display-ticker').innerText = config.ticker || 'Karibu BAM TECH SOLUTIONS...';
                document.getElementById('display-title').innerText = config.title || '';
                
                // Udhibiti wa LIVE au MUBASHARA
                document.getElementById('display-live').style.display = config.showLive ? 'block' : 'none';
                document.getElementById('display-live').innerText = config.liveText || 'LIVE';
                
                // Udhibiti wa L-Style
                document.getElementById('display-lstyle').style.display = config.showLStyle ? 'block' : 'none';
            }
        }, 1000); 
    </script>
</body>
</html>
