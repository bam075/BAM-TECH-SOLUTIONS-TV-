<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAM TECH SOLUTIONS TV</title>
    <!-- Maktaba ya HLS kwa ajili ya kuchezesha Live Stream za IPTV na M3U8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: white; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; }
        
        /* Enzi la Video halisi */
        .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Muundo wa Juu (Overlays) */
        .top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
        .logo { background: #0022aa; padding: 10px 20px; font-weight: bold; font-size: 16px; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: auto; }
        
        .right-side { display: flex; gap: 10px; align-items: center; }
        .program-title { background: rgba(0, 0, 0, 0.75); padding: 10px 20px; border-radius: 5px; font-size: 14px; border: 1px solid #333; display: none; backdrop-filter: blur(5px); }
        .live-badge { background: red; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 14px; display: none; animation: blink 1.5s infinite; box-shadow: 0 0 10px red; }
        
        /* Tangazo la L-Style */
        .l-ad-box { position: absolute; bottom: 70px; left: 20px; width: 280px; background: linear-gradient(135deg, #ff9900, #ff6600); color: black; padding: 15px; border-radius: 8px; z-index: 5; display: none; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); font-weight: bold; }

        /* Maandishi ya chini kabisa (Ticker) */
        .ticker { position: absolute; bottom: 0; left: 0; width: 100%; background: #0022aa; padding: 12px 0; overflow: hidden; z-index: 10; border-top: 1px solid #0044ff; }
        .ticker-text { display: inline-block; padding-left: 100%; animation: scroll 22s linear infinite; font-size: 16px; font-weight: bold; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes scroll { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }
    </style>
</head>
<body>

    <!-- Sehemu ya Video Engine -->
    <div class="video-container">
        <video id="video" autoplay muted playsinline loop></video>
    </div>

    <!-- Sehemu ya Juu kama ilivyo kwenye muonekano wako -->
    <div class="top-bar">
        <div class="logo">BAM TECH SOLUTIONS</div>
        <div class="right-side">
            <div class="program-title" id="display-title">Kipindi: ...</div>
            <div class="live-badge" id="display-live">LIVE</div>
        </div>
    </div>

    <!-- Eneo la Tangazo la L-Style -->
    <div class="l-ad-box" id="display-lstyle">
        <h4 style="margin-bottom:5px; text-transform: uppercase;">Tangazo Maalum</h4>
        <p id="display-ad-text">Nafasi ya tangazo ipo wazi! Wasiliana nasi.</p>
    </div>

    <!-- Ticker ya Chini -->
    <div class="ticker">
        <div class="ticker-text" id="display-ticker">Karibu BAM TECH SOLUTIONS TV...</div>
    </div>

    <script>
        // Hii ni link halisi ya Live Stream ya majaribio (.m3u8). Video itacheza hapa yenyewe!
        const STREAM_URL = 'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8';
        const video = document.getElementById('video');

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(STREAM_URL);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(()=>{}); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = STREAM_URL;
            video.addEventListener('loadedmetadata', function() { video.play().catch(()=>{}); });
        }

        // Mfumo wa kusikiliza amri kutoka kwenye admin.html kila sekunde 1
        setInterval(() => {
            let config = JSON.parse(localStorage.getItem('bam_tv_config'));
            if(config) {
                // Sasisha Ticker
                document.getElementById('display-ticker').innerText = config.ticker || 'Karibu BAM TECH SOLUTIONS TV...';
                
                // Sasisha Jina la Kipindi
                if(config.title) {
                    document.getElementById('display-title').innerText = config.title;
                    document.getElementById('display-title').style.display = 'block';
                } else {
                    document.getElementById('display-title').style.display = 'none';
                }

                // Sasisha Alama ya Live
                document.getElementById('display-live').style.display = config.showLive ? 'block' : 'none';
                document.getElementById('display-live').innerText = config.liveText || 'LIVE';

                // Sasisha L-Style
                if(config.showLStyle) {
                    if(config.adText) { document.getElementById('display-ad-text').innerText = config.adText; }
                    document.getElementById('display-lstyle').style.display = 'block';
                } else {
                    document.getElementById('display-lstyle').style.display = 'none';
                }
            }
        }, 1000);
    </script>
</body>
</html>
