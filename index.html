<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaApp - Tazama Movies Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .auth-section {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 40px;
        }
        .hidden { display: none !important; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            color: #333;
        }
        .btn {
            background: #ff6b6b;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        .btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        .btn-secondary { background: #4ecdc4; }
        .btn-secondary:hover { background: #45b7aa; }
        
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .movie-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-poster {
            width: 100%;
            height: 200px;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .movie-info { padding: 20px; }
        .movie-title { font-size: 1.3em; margin-bottom: 10px; font-weight: bold; }
        .movie-price { font-size: 1.4em; color: #4ecdc4; font-weight: bold; margin-bottom: 15px; }
        .movie-description { opacity: 0.8; margin-bottom: 20px; line-height: 1.5; font-size: 0.95em; }
        
        .payment-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .payment-modal.active { display: flex; }
        .payment-content {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .video-container {
            margin-top: 30px;
            background: #000;
            padding: 10px;
            border-radius: 10px;
        }
        .video-container iframe, .video-container video {
            width: 100%;
            height: 450px;
            border: none;
        }
        .user-info {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎬 CinemaApp</h1>
        <p>Tazama Movies Bora Online - Lipa na Ufurahie!</p>
    </div>

    <div id="authSection" class="auth-section">
        <h2 id="authTitle" style="margin-bottom: 20px;">Ingia Kwenye Akaunti</h2>
        <div class="form-group">
            <label>Barua Pepe (Email):</label>
            <input type="email" id="authEmail" placeholder="mfano@gmail.com">
        </div>
        <div class="form-group">
            <label>Neno la Siri (Password):</label>
            <input type="password" id="authPassword" placeholder="Weka password">
        </div>
        <button class="btn" id="mainAuthBtn" onclick="handleAuth()">Ingia</button>
        <button class="btn btn-secondary" id="switchAuthBtn" onclick="toggleAuthMode()">Sina Akaunti? Jisajili</button>
    </div>

    <div id="userInfo" class="user-info hidden">
        <div>
            <h3>Karibu, <span id="userName" style="color: #4ecdc4;">Mteja</span>!</h3>
            <p>Hali ya Akaunti: <span style="color: #98ff98;">Ipo Tayari</span></p>
        </div>
        <button class="btn btn-danger" style="background: #ff4a4a;" onclick="logout()">Toka</button>
    </div>

    <div id="videoPlayerSection" class="video-container hidden">
        <h2 id="playingTitle" style="margin-bottom: 15px;">Inacheza...</h2>
        <div id="playerWrapper"></div>
        <button class="btn" style="margin-top: 15px;" onclick="closePlayer()">Funga Kichezaji</button>
    </div>

    <div id="moviesSection" class="hidden">
        <h2 style="border-bottom: 2px solid rgba(255,255,255,0.2); padding-bottom: 10px;">Mkusanyiko wa Movies</h2>
        <div class="movies-grid" id="moviesGrid">
            </div>
    </div>
</div>

<div id="paymentModal" class="payment-modal">
    <div class="payment-content">
        <h3 style="margin-bottom: 15px; color: #1e3c72;">Lipa ili Utazame</h3>
        <p id="paymentMovieName" style="font-weight: bold; margin-bottom: 10px;"></p>
        <p style="margin-bottom: 20px; color: #666;">Kiasi: <span id="paymentAmount" style="color: #ff6b6b; font-weight: bold;"></span></p>
        
        <div class="form-group" style="text-align: left;">
            <label style="color: #333;">Namba ya Simu (M-Pesa/Tigo Pesa/Airtel Money):</label>
            <input type="tel" id="payPhone" placeholder="07XXXXXXXX" style="border: 1px solid #ccc;">
        </div>
        
        <button class="btn" onclick="processPayment()">Kamilisha Malipo</button>
        <button class="btn btn-secondary" style="background: #aaa;" onclick="closePaymentModal()">Ghairi</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // WEKA CONFIGURATION ZAKO ZA FIREBASE HAPA
    const firebaseConfig = {
        apiKey: "AIzaSyYOUR_ACTUAL_API_KEY",
        authDomain: "your-project-id.firebaseapp.com",
        databaseURL: "https://your-project-id-default-rtdb.firebaseio.com",
        projectId: "your-project-id",
        storageBucket: "your-project-id.appspot.com",
        messagingSenderId: "1234567890",
        appId: "1:1234567890:web:abcdef"
    };
    
    // Anzisha Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let isSignUpMode = false;
    let selectedMovieId = null;
    let selectedMovieData = null;

    // Angalia kama mtumiaji ameingia
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('moviesSection').classList.remove('hidden');
            document.getElementById('userName').innerText = user.email.split('@')[0];
            loadMovies();
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('moviesSection').classList.add('hidden');
            document.getElementById('videoPlayerSection').classList.add('hidden');
        }
    });

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('authTitle').innerText = isSignUpMode ? "Unda Akaunti Mpya" : "Ingia Kwenye Akaunti";
        document.getElementById('mainAuthBtn').innerText = isSignUpMode ? "Sajili" : "Ingia";
        document.getElementById('switchAuthBtn').innerText = isSignUpMode ? "Tayari una akaunti? Ingia" : "Sina Akaunti? Jisajili";
    }

    function handleAuth() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;

        if(!email || !password) {
            alert("Tafadhali jaza barua pepe na password!");
            return;
        }

        if (isSignUpMode) {
            auth.createUserWithEmailAndPassword(email, password)
                .then(() => alert("Akaunti imeundwa kwa mafanikio!"))
                .catch(err => alert("Hitilafu ya Usajili: " + err.message));
        } else {
            auth.signInWithEmailAndPassword(email, password)
                .catch(err => alert("Hitilafu ya Kuingia: " + err.message));
        }
    }

    function logout() {
        auth.signOut();
    }

    function loadMovies() {
        db.ref('movies').on('value', snapshot => {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            const movies = snapshot.val();
            
            if(!movies) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Hakuna movie zilizowekwa bado.</p>';
                return;
            }

            for (let id in movies) {
                const movie = movies[id];
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="movie-poster">${movie.icon || '🎬'}</div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-price">TSh ${parseInt(movie.price).toLocaleString()}</div>
                        <div class="movie-description">${movie.description || 'Haina maelezo.'}</div>
                        <button class="btn" style="width:100%; margin:0;" onclick="openPayment('${id}', '${movie.title}', ${movie.price})">Lipia na Utazame</button>
                    </div>
                `;
                grid.appendChild(card);
            }
        });
    }

    function openPayment(id, title, price) {
        selectedMovieId = id;
        // Chukua data kamili ya filamu hiyo
        db.ref('movies/' + id).once('value', snapshot => {
            selectedMovieData = snapshot.val();
            document.getElementById('paymentMovieName').innerText = title;
            document.getElementById('paymentAmount').innerText = "TSh " + parseInt(price).toLocaleString();
            document.getElementById('paymentModal').classList.add('active');
        });
    }

    function closePaymentModal() {
        document.getElementById('paymentModal').classList.remove('active');
    }

    function processPayment() {
        const phone = document.getElementById('payPhone').value;
        if(!phone || phone.length < 10) {
            alert("Weka namba ya simu sahihi ya malipo!");
            return;
        }

        alert("Ombi la malipo limetumwa kwenda namba " + phone + ". Tafadhali weka namba yako ya siri ya mtandao kwenye simu yako kukamilisha.");

        setTimeout(() => {
            // Rekodi mauzo Firebase kwa ajili ya Admin Dashboard
            const saleRef = db.ref('sales').push();
            saleRef.set({
                userEmail: auth.currentUser.email,
                movieTitle: selectedMovieData.title,
                amount: parseInt(selectedMovieData.price),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            closePaymentModal();
            playMovie(selectedMovieData);
        }, 3000); 
    }

    function playMovie(movie) {
        const playerWrapper = document.getElementById('playerWrapper');
        document.getElementById('playingTitle').innerText = `Inacheza sasa: ${movie.title}`;
        
        // Angalia kama link ni ya YouTube au faili ya moja kwa moja (MP4)
        if(movie.videoUrl.includes('youtube.com') || movie.videoUrl.includes('youtu.be')) {
            let embedUrl = movie.videoUrl;
            if(movie.videoUrl.includes('watch?v=')) {
                embedUrl = movie.videoUrl.replace('watch?v=', 'embed/');
            } else if(movie.videoUrl.includes('youtu.be/')) {
                embedUrl = movie.videoUrl.replace('youtu.be/', 'youtube.com/embed/');
            }
            playerWrapper.innerHTML = `<iframe src="${embedUrl}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
        } else {
            playerWrapper.innerHTML = `<video src="${movie.videoUrl}" controls autoplay></video>`;
        }

        const section = document.getElementById('videoPlayerSection');
        section.classList.remove('hidden');
        section.scrollIntoView({ behavior: 'smooth' });
    }

    function closePlayer() {
        document.getElementById('playerWrapper').innerHTML = '';
        document.getElementById('videoPlayerSection').classList.add('hidden');
    }
</script>
</body>
</html>
