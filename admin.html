<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paneli ya Mkurugenzi - BAM TECH TV</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #020617; color: #f8fafc; padding: 15px; margin: 0; }
        .panel-container { max-width: 700px; margin: 20px auto; background: #0f172a; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; }
        h1, h2 { text-align: center; }
        h1 { font-size: 20px; margin-bottom: 25px; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 900; }
        h2 { font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; color: #94a3b8; text-align: left; margin-top: 0; text-transform: uppercase; }
        .section-card { border-left: 4px solid #2563eb; padding: 15px; margin-bottom: 20px; background: rgba(255,255,255,0.02); border-radius: 0 12px 12px 0; border-top: 1px solid rgba(255,255,255,0.02); border-right: 1px solid rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.02); }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input { width: 100%; padding: 10px; background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: white; box-sizing: border-box; font-size: 13px; outline: none; }
        select:focus, input:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 14px; background: #2563eb; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 15px; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        button:hover { background: #1d4ed8; box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
        .status-msg { text-align: center; font-weight: bold; margin-top: 15px; font-size: 13px; }
    </style>
</head>
<body>

<div class="panel-container">
    <h1>PANELI YA KISASA YA MKURUGENZI:<br>BAM TECH TV</h1>

    <div class="section-card">
        <h2>📺 1. Udhibiti wa Video (Live Stream / MP4 Clip)</h2>
        <div class="form-group">
            <label>LINK YA UTANGAZAJI (STREAM AU MP4 URL):</label>
            <input type="text" id="video-url" placeholder="Paste link ya .m3u8 au faili la video la .mp4 hapa...">
        </div>
        <div class="form-group">
            <label>KIPINDI KINACHOCHEZWA SASA:</label>
            <input type="text" id="current-show" placeholder="Mfano: Tech Insights & Global Innovation">
        </div>
        <div class="form-group">
            <label>AINA YA MAUDHUI (CONTENT TYPE):</label>
            <input type="text" id="content-type" placeholder="Mfano: Burudani & Teknolojia Halisi">
        </div>
        <div class="form-group">
            <label>UBORA WA PICHA (RESOLUTION OVERRIDE - OPTIONAL):</label>
            <input type="text" id="quality" placeholder="Mfano: 1080p Ultra HD (Acha wazi kuruhusu Auto)">
        </div>
    </div>

    <div class="section-card" style="border-left-color: #10b981;">
        <h2>📊 2. Live Badge & Watazamaji Fake/Real</h2>
        <div class="form-group">
            <label>HALI YA LIIVE PILL (BADGE):</label>
            <select id="show-live">
                <option value="true">Washa / Onyesha Kitufe cha LIVE</option>
                <option value="false">Zima / Ficha Kitufe cha LIVE</option>
            </select>
        </div>
        <div class="form-group">
            <label>MAANDISHI YA LIVE BADGE:</label>
            <input type="text" id="live-text" value="LIVE">
        </div>
        <div class="form-group">
            <label>IDADI YA WATAZAMAJI HALISI (FORCE VIEWERS):</label>
            <input type="number" id="viewers-count" placeholder="Mfano: 3420">
        </div>
    </div>

    <div class="section-card" style="border-left-color: #a855f7;">
        <h2>🚀 3. Udhibiti wa Matangazo ya L-Style (Maandishi, Picha, Video)</h2>
        <div class="form-group">
            <label>HALI YA TANGAZO LA L-STYLE:</label>
            <select id="show-lstyle" onchange="toggleAdFields()">
                <option value="false">Zima / Ficha Tangazo</option>
                <option value="true">Washa / Onyesha Tangazo</option>
            </select>
        </div>
        <div class="form-group">
            <label>AINA YA TANGAZO (AD TYPE):</label>
            <select id="ad-type" onchange="toggleAdFields()">
                <option value="text">Tangazo la Maandishi tu (Text)</option>
                <option value="image">Tangazo la Picha (Image URL)</option>
                <option value="video">Tangazo la Video Fupi (Video URL .mp4)</option>
            </select>
        </div>
        <div class="form-group id-ad-field" id="field-ad-text">
            <label>MAANDISHI YA TANGAZO (TEXT):</label>
            <input type="text" id="ad-text" placeholder="Andika ujumbe wa tangazo hapa...">
        </div>
        <div class="form-group id-ad-field" id="field-ad-image" style="display:none;">
            <label>LINK YA PICHA YA TANGAZO (IMAGE URL):</label>
            <input type="text" id="ad-image-url" placeholder="Paste direct link ya picha ya tangazo (.jpg/.png)...">
        </div>
        <div class="form-group id-ad-field" id="field-ad-video" style="display:none;">
            <label>LINK YA VIDEO FUPI YA TANGAZO (VIDEO URL):</label>
            <input type="text" id="ad-video-url" placeholder="Paste direct link ya video fupi (.mp4)...">
        </div>
    </div>

    <div class="section-card" style="border-left-color: #f59e0b;">
        <h2>📅 4. Ticker Inayotembea Chini</h2>
        <div class="form-group">
            <label>HALI YA TICKER BAR:</label>
            <select id="show-ticker">
                <option value="false">Ficha Ticker</option>
                <option value="true">Onyesha Ticker</option>
            </select>
        </div>
        <div class="form-group">
            <label>MANENO YANAYOTEMBEA:</label>
            <input type="text" id="ticker-text-content" placeholder="Andika taarifa zitakazotembea chini kabisa kwenye TV...">
        </div>
    </div>

    <div class="section-card" style="border-left-color: #64748b;">
        <h2>📝 5. Ratiba ya Vipindi (Leo)</h2>
        <div class="form-group">
            <label>KIPINDI CHA 1 (MUDA & MAELEZO):</label>
            <input type="text" id="sch-t1" placeholder="Muda wke (Mfano: 08:00 AM - LIVE)" style="margin-bottom:5px;">
            <input type="text" id="sch-d1" placeholder="Jina au maelezo ya kipindi cha kwanza...">
        </div>
        <div class="form-group">
            <label>KIPINDI CHA 2 (MUDA & MAELEZO):</label>
            <input type="text" id="sch-t2" placeholder="Muda (Mfano: 02:00 PM)" style="margin-bottom:5px;">
            <input type="text" id="sch-d2" placeholder="Maelezo ya kipindi...">
        </div>
        <div class="form-group">
            <label>KIPINDI CHA 3 (MUDA & MAELEZO):</label>
            <input type="text" id="sch-t3" placeholder="Muda (Mfano: 06:30 PM)" style="margin-bottom:5px;">
            <input type="text" id="sch-d3" placeholder="Maelezo ya kipindi...">
        </div>
        <div class="form-group">
            <label>KIPINDI CHA 4 (MUDA & MAELEZO):</label>
            <input type="text" id="sch-t4" placeholder="Muda (Mfano: 09:00 PM)" style="margin-bottom:5px;">
            <input type="text" id="sch-d4" placeholder="Maelezo ya kipindi...">
        </div>
    </div>

    <button id="btn-save">Hifadhi & Kusambaza Mabadiliko Halisi</button>
    <p id="status-msg" class="status-msg"></p>
</div>

<script>
    // CONFIGURATION YA FIREBASE (Imeunganishwa moja kwa moja na index)
    const firebaseConfig = {
      apiKey: "AIzaSyAh7LRqKy5RfLUr0tpqA47TV7v221699bb5c8d2", 
      authDomain: "bam-tech-solutions-tv.firebaseapp.com",
      databaseURL: "https://bam-tech-solutions-tv-default-rtdb.firebaseio.com/",
      projectId: "bam-tech-solutions-tv",
      storageBucket: "bam-tech-solutions-tv.appspot.com",
      messagingSenderId: "101371123351",
      appId: "1:101371123351:web:173b1884f221699bb5c8d2"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function toggleAdFields() {
        const type = document.getElementById('ad-type').value;
        document.getElementById('field-ad-text').style.display = (type === 'text') ? 'block' : 'none';
        document.getElementById('field-ad-image').style.display = (type === 'image') ? 'block' : 'none';
        document.getElementById('field-ad-video').style.display = (type === 'video') ? 'block' : 'none';
    }

    document.getElementById('btn-save').addEventListener('click', () => {
        const msg = document.getElementById('status-msg');
        const streamUrl = document.getElementById('video-url').value;
        const viewers = document.getElementById('viewers-count').value;

        // 1. Kusave Video Stream Url
        if(streamUrl.trim() !== "") {
            database.ref('bam_stream_url').set(streamUrl);
        }

        // 2. Kusave Viewers Counter (Ukiweka itafreeze hapo hapo uliyotaka)
        if(viewers.trim() !== "") {
            database.ref('bam_forced_viewers').set(parseInt(viewers));
        }

        // 3. Kusave Config Zote Maalum kwenye Node Moja
        database.ref('bam_tv_config').set({
            title: document.getElementById('current-show').value,
            contentType: document.getElementById('content-type').value,
            resolution_text: document.getElementById('quality').value,
            showLive: document.getElementById('show-live').value === "true",
            liveText: document.getElementById('live-text').value,
            showLStyle: document.getElementById('show-lstyle').value === "true",
            adType: document.getElementById('ad-type').value,
            adText: document.getElementById('ad-text').value,
            adImageUrl: document.getElementById('ad-image-url').value,
            adVideoUrl: document.getElementById('ad-video-url').value,
            showTicker: document.getElementById('show-ticker').value === "true",
            ticker: document.getElementById('ticker-text-content').value,
            sch_t1: document.getElementById('sch-t1').value,
            sch_d1: document.getElementById('sch-d1').value,
            sch_t2: document.getElementById('sch-t2').value,
            sch_d2: document.getElementById('sch-d2').value,
            sch_t3: document.getElementById('sch-t3').value,
            sch_d3: document.getElementById('sch-d3').value,
            sch_t4: document.getElementById('sch-t4').value,
            sch_d4: document.getElementById('sch-d4').value
        }).then(() => {
            msg.style.color = "#10b981";
            msg.innerText = "✅ Kazi Safi! Mabadiliko yote yamerushwa kwenye TV sasa hivi!";
        }).catch((err) => {
            msg.style.color = "#dc2626";
            msg.innerText = "❌ Hitilafu Imetokea: " + err.message;
        });
    });
</script>

</body>
</html>
