<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAM TECH TV - Jopo Kuu la Mmiliki</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #020617; color: #f8fafc; margin: 0; padding: 20px; }
        .lock-container { max-width: 400px; margin: 100px auto; background: #0f172a; padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        .dashboard { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .dashboard { grid-template-columns: 1fr 350px; } }
        .card { background: #0f172a; border-radius: 14px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
        h2, h3 { color: #3b82f6; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; font-size: 16px; letter-spacing: 0.5px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        input[type="text"], input[type="password"], select { width: 100%; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); padding: 10px 12px; border-radius: 8px; color: white; outline: none; margin-bottom: 15px; font-size: 13px; }
        button { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        button:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; } .btn-danger:hover { background: #b91c1c; }
        .flex-btns { display: flex; gap: 10px; }
        .chat-box-admin { height: 300px; overflow-y: auto; background: #020617; border-radius: 8px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 8px; }
        .chat-row { font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 6px; position: relative; }
        .chat-row strong { color: #60a5fa; }
        .reply-link { color: #f59e0b; font-weight: bold; cursor: pointer; float: right; }
        .toast { position: fixed; top: 20px; right: 20px; background: #10b981; color: white; padding: 10px 20px; border-radius: 6px; font-size: 12px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="lock-container" id="gatekeeper">
        <h2 style="font-size:18px; margin-bottom:5px;">🎛️ BAM TECH TV PANEL</h2>
        <p style="font-size:12px; color:#64748b; margin-bottom:20px;">Ukurasa huu ni salama na wa siri wa Mmiliki pekee.</p>
        <label>Ingiza PIN Kuu ya Usimamizi:</label>
        <input type="password" id="master-pin" placeholder="••••">
        <button onclick="unlockDashboard()" style="width:100%;">INGIA DASHBODI</button>
    </div>

    <div class="dashboard" id="main-panel" style="display: none;">
        
        <div class="card" style="grid-column: 1;">
            <h2>📺 USIMAMIZI WA MATANGAZO YA TELEVISHENI</h2>
            <hr style="border: 1px solid rgba(255,255,255,0.04); margin-bottom:15px;">
            
            <label>1. Link Kuu ya Mkururo wa Video (.m3u8 au IPTV Stream URL):</label>
            <input type="text" id="stream-url-field" placeholder="https://domain.com/live/stream.m3u8">
            
            <label>2. Jina la Kipindi (Litaonekana Upande wa Kulia wa Navbar):</label>
            <input type="text" id="program-title-field" placeholder="Mfano: Tech Insights na Bryan Alex">
            
            <label>3. Alama Maalum ya Live / Mubashara:</label>
            <select id="live-badge-selector">
                <option value="OFF">Zima Alama Zote (Hali ya Kawaida)</option>
                <option value="LIVE">Washa na Uandike "LIVE"</option>
                <option value="MUBASHARA">Washa na Uandike "MUBASHARA"</option>
            </select>

            <label>4. Tangazo la Kushoto la L-Style (Litalazimishwa kuonekana ukijaza hapa):</label>
            <input type="text" id="lstyle-text-field" placeholder="Andika maelezo ya tangazo hapa...">
            <select id="lstyle-status-selector" style="margin-top:-5px;">
                <option value="OFF">Ficha Tangazo la L-Style</option>
                <option value="ON">Washa Tangazo Lionekane Sasa Hivi</option>
            </select>

            <label>5. Maandishi ya chini kabisa yanayopita (Ticker Info Text):</label>
            <input type="text" id="ticker-text-field" placeholder="Andika habari au ujumbe unaotaka upite chini kabisa ya TV...">
            <select id="ticker-status-selector" style="margin-top:-5px;">
                <option value="OFF">Ficha Ticker Bar Yote</option>
                <option value="ON">Washa Ticker Bar Sasa Hivi</option>
            </select>

            <label>6. Badilisha Idadi ya Watazamaji (Hardcode Viewers Control):</label>
            <input type="text" id="viewer-count-field" placeholder="Mfano: 2500 (Acha wazi kurejea mfumo wa kawaida)">

            <button onclick="publishLiveChanges()" style="width: 100%; padding:14px; font-size:14px;">🚀 RUSHA MABADILIKO HEWANI SASA HIVI</button>
        </div>

        <div class="card" style="grid-column: span 1;">
            <h2>💬 LIVE CHAT REPLIES INTERACTIVE</h2>
            <p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">Maoni yote ya watazamaji kutoka index.html yanajazwa hapa chini moja kwa moja.</p>
            
            <div class="chat-box-admin" id="admin-chat-viewer">
                </div>
            
            <div style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.05); padding-top:15px;">
                <label id="reply-target-label">Jibu Maoni kama Mmiliki (BAM TECH Admin):</label>
                <input type="text" id="admin-reply-input" placeholder="Andika jibu lako la haraka...">
                <div class="flex-btns">
                    <button onclick="sendAdminReplyDirect()" style="flex:1;">Tuma Jibu</button>
                    <button class="btn-danger" onclick="clearChatLog()">Futa Kumbukumbu</button>
                </div>
            </div>
        </div>

    </div>

    <div class="toast" id="save-toast">Mabadiliko Yamerushwa Kwenye TV kwa Mafanikio! ✓</div>

    <script>
        function unlockDashboard() {
            const pin = document.getElementById('master-pin').value;
            if(pin === "BAM2026") { // PIN salama uliyochagua mwenyewe
                document.getElementById('gatekeeper').style.display = 'none';
                document.getElementById('main-panel').style.display = 'grid';
                loadCurrentConfigValues();
                startAdminChatListener();
            } else {
                alert("❌ PIN uliyoweka sio sahihi! Hakuna idhini.");
            }
        }

        function loadCurrentConfigValues() {
            let savedUrl = localStorage.getItem('bam_stream_url');
            if(savedUrl) document.getElementById('stream-url-field').value = savedUrl;
            
            let config = JSON.parse(localStorage.getItem('bam_tv_config'));
            if(config) {
                document.getElementById('program-title-field').value = config.title || '';
                document.getElementById('lstyle-text-field').value = config.adText || '';
                document.getElementById('ticker-text-field').value = config.ticker || '';
                document.getElementById('live-badge-selector').value = config.showLive ? config.liveText : 'OFF';
                document.getElementById('lstyle-status-selector').value = config.showLStyle ? 'ON' : 'OFF';
                document.getElementById('ticker-status-selector').value = config.showTicker ? 'ON' : 'OFF';
            }
            let forcedViewers = localStorage.getItem('bam_forced_viewers');
            if(forcedViewers) document.getElementById('viewer-count-field').value = forcedViewers;
        }

        function publishLiveChanges() {
            // Hifadhi link ya video
            let urlField = document.getElementById('stream-url-field').value;
            if(urlField.trim() !== "") {
                localStorage.setItem('bam_stream_url', urlField);
            }

            // Hifadhi idadi ya watazamaji
            let viewersField = document.getElementById('viewer-count-field').value;
            if(viewersField.trim() !== "") {
                localStorage.setItem('bam_forced_viewers', viewersField);
            } else {
                localStorage.removeItem('bam_forced_viewers');
            }

            // Unda config kamili ya vitu vya muonekano
            let liveSelector = document.getElementById('live-badge-selector').value;
            let lstyleSelector = document.getElementById('lstyle-status-selector').value;
            let tickerSelector = document.getElementById('ticker-status-selector').value;

            let config = {
                title: document.getElementById('program-title-field').value,
                adText: document.getElementById('lstyle-text-field').value,
                ticker: document.getElementById('ticker-text-field').value,
                showLive: liveSelector !== 'OFF',
                liveText: liveSelector !== 'OFF' ? liveSelector : 'LIVE',
                showLStyle: lstyleSelector === 'ON',
                showTicker: tickerSelector === 'ON'
            };

            localStorage.setItem('bam_tv_config', JSON.stringify(config));

            // Onyesha arifa ya mafanikio
            const toast = document.getElementById('save-toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function startAdminChatListener() {
            setInterval(() => {
                const viewer = document.getElementById('admin-chat-viewer');
                let chats = JSON.parse(localStorage.getItem('bam_tv_chats')) || [];
                viewer.innerHTML = '';
                
                chats.forEach(item => {
                    let div = document.createElement('div');
                    div.className = 'chat-row';
                    div.innerHTML = `<span style="color:#64748b; font-size:10px;">[${item.time}]</span> <strong>${item.user}:</strong> <span>${item.text}</span>
                                     <span class="reply-link" onclick="setupReplyTag('${item.user}')">[JIBU]</span>`;
                    viewer.appendChild(div);
                });
            }, 1000);
        }

        function setupReplyTag(user) {
            document.getElementById('admin-reply-input').value = `@${user} `;
            document.getElementById('admin-reply-input').focus();
        }

        function sendAdminReplyDirect() {
            let text = document.getElementById('admin-reply-input').value;
            if(text.trim() !== "") {
                let replyObject = { text: text, timestamp: new Date().toLocaleTimeString() };
                localStorage.setItem('bam_admin_reply_trigger', JSON.stringify(replyObject));
                document.getElementById('admin-reply-input').value = '';
            }
        }

        function clearChatLog() {
            if(confirm("Je, una uhakika unataka kufuta maoni yote kwenye orodha yako ya Admin?")) {
                localStorage.removeItem('bam_tv_chats');
            }
        }
    </script>
</body>
</html>
