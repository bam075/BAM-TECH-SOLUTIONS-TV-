<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paneli ya Mkurugenzi - BAM TECH TV</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        .panel-container { max-width: 600px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { text-align: center; color: #ffffff; font-size: 20px; text-transform: uppercase; }
        .section-card { border-left: 4px solid #1f6feb; padding-left: 15px; margin-bottom: 25px; background: #21262d; padding: 15px; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #8b949e; }
        select, input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; color: #white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #238636; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 15px; }
        button:hover { background: #2ea043; }
        .btn-danger { background: #da3637; }
        .btn-danger:hover { background: #f85149; }
        .status-msg { text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="panel-container">
    <h1>PANELI YA KISASA YA MKURUGENZI:<br>BAM TECH TV</h1>

    <div class="section-card">
        <h2>📺 1. Source & Advanced Playback Options</h2>
        <div class="form-group">
            <label>AINA YA VIDEO (PLAYBACK MODE):</label>
            <select id="playback-mode">
                <option value="mp4">Video Faili Maalum (Direct MP4 / Clip File)</option>
                <option value="hls">Mkururo wa Moja kwa Moja (HLS Stream .m3u8)</option>
            </select>
        </div>
        <div class="form-group">
            <label>KIPINDI KINACHOCHEZWA SASA:</label>
            <input type="text" id="current-show" placeholder="Mfano: Majaribio ya Mfumo">
        </div>
        <div class="form-group">
            <label>LINK YA MEDIA / VIDEO URL:</label>
            <input type="text" id="video-url" placeholder="Weka .mp4 au .m3u8 link hapa...">
        </div>
    </div>

    <div class="section-card">
        <h2>🚨 2. Global L-Style Advertisements</h2>
        <div class="form-group">
            <label>TANGAZO LA L-STYLE DISPLAY:</label>
            <select id="ad-display">
                <option value="onyesha">Onyesha Box la Tangazo</option>
                <option value="ficha">Ficha Box la Tangazo</option>
            </select>
        </div>
        <div class="form-group">
            <label>MAANDISHI YA TANGAZO:</label>
            <input type="text" id="ad-text" placeholder="Andika ujumbe wa tangazo hapa...">
        </div>
    </div>

    <div class="section-card">
        <h2>📅 3. Ticker & Ratiba ya Vipindi</h2>
        <div class="form-group">
            <label>HALI YA TICKER YA CHINI:</label>
            <select id="ticker-status">
                <option value="onyesha">Onyesha Ticker</option>
                <option value="zima">Zima Ticker</option>
            </select>
        </div>
        <div class="form-group">
            <label>MAANDISHI YA TICKER YA CHINI:</label>
            <input type="text" id="ticker-text" placeholder="Andika maandishi yanayotembea chini...">
        </div>
    </div>

    <div class="section-card" style="border-left-color: #da3637;">
        <h2>🔒 4. Usalama wa Akaunti (Badili Password)</h2>
        <div class="form-group">
            <label>PASSWORD MPYA YA ADMIN:</label>
            <input type="password" id="new-password" placeholder="Weka password mpya (Angalau herufi 6)...">
        </div>
        <button id="btn-change-password" class="btn-danger">Hifadhi Password Mpya</button>
        <p id="password-status-msg" class="status-msg"></p>
    </div>

    <button id="btn-save-settings">Hifadhi Mabadiliko ya TV</button>
    <p id="main-status-msg" class="status-msg"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, updatePassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Firebase Config inayolingana na picha yako ya Firebase Console
    const firebaseConfig = {
        apiKey: "AIzaSyAh7LRqKy5RfLUr0tpqA47TV7v221699bb5c8d2",
        authDomain: "bam-tech-solutions-tv.firebaseapp.com",
        databaseURL: "https://bam-tech-solutions-tv-default-rtdb.firebaseio.com",
        projectId: "bam-tech-solutions-tv",
        storageBucket: "bam-tech-solutions-tv.appspot.com",
        messagingSenderId: "101371123351",
        appId: "1:101371123351:web:173b1884f221699bb5c8d2",
        measurementId: "G-NKZ07VGJX7"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // 1. Kazi ya kusave Mabadiliko ya Panel kwenda Realtime Database
    document.getElementById('btn-save-settings').addEventListener('click', () => {
        const mode = document.getElementById('playback-mode').value;
        const show = document.getElementById('current-show').value;
        const url = document.getElementById('video-url').value;
        const adDisplay = document.getElementById('ad-display').value;
        const adText = document.getElementById('ad-text').value;
        const tickerStatus = document.getElementById('ticker-status').value;
        const tickerText = document.getElementById('ticker-text').value;

        const mainStatus = document.getElementById('main-status-msg');

        set(ref(database, 'tv_settings/'), {
            playbackMode: mode,
            currentShow: show,
            videoUrl: url,
            adDisplay: adDisplay,
            adText: adText,
            tickerStatus: tickerStatus,
            tickerText: tickerText
        }).then(() => {
            mainStatus.style.color = "#2ea043";
            mainStatus.innerText = "✅ Mabadiliko ya TV yamehifadhiwa hewani!";
        }).catch((error) => {
            mainStatus.style.color = "#f85149";
            mainStatus.innerText = "❌ Hitilafu ya Mfumo: " + error.message;
        });
    });

    // 2. KIPENGELE KIPYA: Kazi ya Kubadili Password ya Admin
    document.getElementById('btn-change-password').addEventListener('click', () => {
        const newPassword = document.getElementById('new-password').value;
        const passStatus = document.getElementById('password-status-msg');
        const activeUser = auth.currentUser;

        if (!newPassword || newPassword.length < 6) {
            passStatus.style.color = "#f85149";
            passStatus.innerText = "⚠️ Password lazima iwe na urefu wa herufi/namba 6 au zaidi!";
            return;
        }

        if (activeUser) {
            updatePassword(activeUser, newPassword).then(() => {
                passStatus.style.color = "#2ea043";
                passStatus.innerText = "✅ Password ya Admin imebadilishwa kikamilifu!";
                document.getElementById('new-password').value = ""; // Futa text box
            }).catch((error) => {
                console.error(error);
                if (error.code === 'auth/requires-recent-login') {
                    passStatus.style.color = "#ffa500";
                    passStatus.innerText = "🔒 Usalama: Log Out kwanza, kisha Log In tena ili ubadili password.";
                } else {
                    passStatus.style.color = "#f85149";
                    passStatus.innerText = "❌ Hitilafu: " + error.message;
                }
            });
        } else {
            passStatus.style.color = "#f85149";
            passStatus.innerText = "⚠️ Hujafanikiwa kuingia (Not Logged In) kama Admin!";
        }
    });
</script>

</body>
</html>
