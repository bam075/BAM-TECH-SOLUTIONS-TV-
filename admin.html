<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAM TECH - Control Room</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; }
        .control-group { margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 5px solid #0056b3; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #0056b3; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; margin-top: 10px; font-weight: bold; width: 100%; }
        button:hover { background: #004494; }
        .btn-danger { background: #dc3545; margin-top: 5px;}
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #28a745; margin-top: 5px;}
        .btn-success:hover { background: #218838; }
        .flex-btns { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- Eneo la Kuingia (Login) -->
    <div class="container" id="login-section">
        <h2>🔒 INGIA CONTROL ROOM</h2>
        <p style="text-align:center; color:#555;">Weka PIN ya Admin ya BAM TECH.</p>
        <input type="password" id="pinInput" placeholder="Ingiza PIN yako (mfano: 1234)">
        <button onclick="login()">INGIA NDANI</button>
    </div>

    <!-- Dashbodi ya Admin (Imejificha mpaka PIN iwe sahihi) -->
    <div class="container" id="admin-section" style="display:none;">
        <h2>🎛️ DASHBODI YA BAM TECH</h2>
        
        <div class="control-group">
            <label><b>1. Jina la Kipindi Kinachoendelea:</b></label>
            <input type="text" id="input-title" placeholder="Mfano: Tech Updates na Bryan">
            <button onclick="updateConfig()">Badilisha Jina</button>
        </div>

        <div class="control-group">
            <label><b>2. Maandishi Yanayopita (Ticker):</b></label>
            <input type="text" id="input-ticker" placeholder="Andika taarifa zinazopita chini...">
            <button onclick="updateConfig()">Sasisha Ticker</button>
        </div>

        <div class="control-group">
            <label><b>3. Tangazo la L-Style:</b></label>
            <div class="flex-btns">
                <button class="btn-success" onclick="toggleLStyle(true)">Washa Tangazo</button>
                <button class="btn-danger" onclick="toggleLStyle(false)">Zima Tangazo</button>
            </div>
        </div>

        <div class="control-group">
            <label><b>4. Alama ya Matangazo Mubashara:</b></label>
            <div class="flex-btns">
                <button class="btn-success" onclick="toggleLive(true, 'LIVE')">Weka: LIVE</button>
                <button class="btn-success" onclick="toggleLive(true, 'MUBASHARA')">Weka: MUBASHARA</button>
            </div>
            <button class="btn-danger" onclick="toggleLive(false, '')">Zima Alama Yote</button>
        </div>
    </div>

    <script>
        // Taarifa za msingi endapo mfumo ndio unafunguliwa mara ya kwanza
        let currentConfig = JSON.parse(localStorage.getItem('bam_tv_config')) || {
            ticker: "Karibu BAM TECH SOLUTIONS...",
            title: "Kipindi: BAM TECH LIVE",
            showLStyle: false,
            showLive: false,
            liveText: "LIVE"
        };

        function login() {
            let pin = document.getElementById('pinInput').value;
            // PIN yako ni 1234. Unaweza kuibadilisha hapa chini.
            if(pin === "1234") { 
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                
                // Weka taarifa zilizopo kwenye fomu
                document.getElementById('input-ticker').value = currentConfig.ticker;
                document.getElementById('input-title').value = currentConfig.title;
            } else {
                alert("❌ PIN sio sahihi! Jaribu tena.");
            }
        }

        function updateConfig() {
            currentConfig.ticker = document.getElementById('input-ticker').value;
            currentConfig.title = document.getElementById('input-title').value;
            saveConfig();
        }

        function toggleLStyle(status) {
            currentConfig.showLStyle = status;
            saveConfig();
        }

        function toggleLive(status, text) {
            currentConfig.showLive = status;
            currentConfig.liveText = text;
            saveConfig();
        }

        function saveConfig() {
            localStorage.setItem('bam_tv_config', JSON.stringify(currentConfig));
            // Mfumo unatoa ujumbe mfupi kila unapofanya mabadiliko
            let btn = document.activeElement;
            let originalText = btn.innerText;
            btn.innerText = "Tayari ✓";
            setTimeout(() => { btn.innerText = originalText; }, 1000);
        }
    </script>
</body>
</html>
