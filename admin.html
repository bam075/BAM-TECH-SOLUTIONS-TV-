<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAM TECH - Control Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .wrapper { max-width: 550px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #0033aa; margin-bottom: 25px; font-size: 22px; border-bottom: 2px solid #f0f4f8; padding-bottom: 10px; }
        .section-box { background: #f9fbfd; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e1e8ed; }
        label { font-weight: 600; font-size: 14px; color: #555; display: block; margin-bottom: 8px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background: #0056b3; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #0033aa; }
        .btn-flex { display: flex; gap: 10px; margin-top: 5px; }
        .btn-on { background: #28a745; }
        .btn-on:hover { background: #218838; }
        .btn-off { background: #dc3545; }
        .btn-off:hover { background: #c82333; }
        .status-msg { text-align: center; color: green; font-weight: bold; margin-top: 5px; display: none; font-size: 13px; }
    </style>
</head>
<body>

    <!-- LOGIN AREA -->
    <div class="wrapper" id="lock-screen">
        <h2>🔒 BAM TECH CONTROL ROOM</h2>
        <label>Ingiza PIN ya Usimamizi:</label>
        <input type="password" id="adminPin" placeholder="Weka PIN hapa...">
        <button onclick="checkAccess()">INGIA DASHBODI</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="wrapper" id="dash-screen" style="display: none;">
        <h2>🎛️ BAM TECH MAIN DASHBOARD</h2>
        
        <!-- 1. Program Title -->
        <div class="section-box">
            <label>Jina la Kipindi (Upande wa Kulia):</label>
            <input type="text" id="progTitle" placeholder="Mfano: Tech Talk na Bryan">
            <button onclick="saveData()">Sasisha Jina</button>
        </div>

        <!-- 2. Ticker text -->
        <div class="section-box">
            <label>Maandishi ya Chini (Ticker):</label>
            <input type="text" id="tickerText" placeholder="Andika habari inayopita chini...">
            <button onclick="saveData()">Sasisha Ticker</button>
        </div>

        <!-- 3. L-Style Advertisement -->
        <div class="section-box">
            <label>Tangazo la L-Style:</label>
            <input type="text" id="adContent" placeholder="Andika maelezo ya tangazo la L-Style...">
            <div class="btn-flex">
                <button class="btn-on" onclick="controlLStyle(true)">Washa Tangazo</button>
                <button class="btn-off" onclick="controlLStyle(false)">Zima Tangazo</button>
            </div>
        </div>

        <!-- 4. Live / Mubashara Badge -->
        <div class="section-box">
            <label>Alama ya Live / Mubashara:</label>
            <div class="btn-flex">
                <button class="btn-on" onclick="controlLive(true, 'LIVE')">Weka LIVE</button>
                <button class="btn-on" onclick="controlLive(true, 'MUBASHARA')">Weka MUBASHARA</button>
            </div>
            <button class="btn-off" onclick="controlLive(false, '')">Ondoa Alama Yote</button>
        </div>
        
        <div class="status-msg" id="alertMsg">Mabadiliko yamefanyika kwa mafanikio! ✓</div>
    </div>

    <script>
        // Taarifa za mwanzo kabisa kuzuia makosa ya mfumo
        let config = JSON.parse(localStorage.getItem('bam_tv_config')) || {
            ticker: "Karibu kwenye mfumo wa majaribio wa BAM TECH SOLUTIONS TV...",
            title: "",
            showLStyle: false,
            adText: "",
            showLive: false,
            liveText: "LIVE"
        };

        function checkAccess() {
            let pin = document.getElementById('adminPin').value;
            if(pin === "1234") { // Hii ndio PIN yako ya kuingilia
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('dash-screen').style.display = 'block';
                
                // Jaza data zilizopo kwenye fomu
                document.getElementById('progTitle').value = config.title;
                document.getElementById('tickerText').value = config.ticker;
                document.getElementById('adContent').value = config.adText;
            } else {
                alert("❌ PIN uliyoweka sio sahihi!");
            }
        }

        function saveData() {
            config.title = document.getElementById('progTitle').value;
            config.ticker = document.getElementById('tickerText').value;
            config.adText = document.getElementById('adContent').value;
            pushToStorage();
        }

        function controlLStyle(status) {
            config.showLStyle = status;
            config.adText = document.getElementById('adContent').value;
            pushToStorage();
        }

        function controlLive(status, text) {
            config.showLive = status;
            config.liveText = text;
            pushToStorage();
        }

        function pushToStorage() {
            localStorage.setItem('bam_tv_config', JSON.stringify(config));
            let msg = document.getElementById('alertMsg');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 2000);
        }
    </script>
</body>
</html>
